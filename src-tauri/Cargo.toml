[package]
name = "splitr"
version = "0.1.2"
description = "Smart PDF Splitter: split one PDF into several by chapter, invoice, student and more"
authors = ["Caleb Mensah"]
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "splitr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# The browser launchers, run with the AppImage's environment removed (#31), see src/browser.rs.
# Already used by tauri-plugin-opener.
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
thiserror = "2"
tauri-plugin-dialog = "2"
# PDF engine (SRS 5.3), see src/pdf.rs. The pdfium_7881 feature must match the PDFium
# version that scripts/fetch-pdfium.mjs downloads; change both together.
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_7881", "image_latest", "thread_safe"] }
lopdf = "0.46"
# Encodes rendered pages as JPEG thumbnails (FR-10). Same version pdfium-render uses.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# Private, randomly named thumbnail folder per session (NFR-07), see src/viewer.rs, and temp
# files for parts before they are renamed (NFR-09), see src/export.rs.
tempfile = "3"
# Bundles parts into one ZIP (FR-53). No compression features: PDF content is compressed already.
# "chrono" stamps entries with the local time; without it they are dated 1980-01-01.
zip = { version = "9.1.3", default-features = false, features = ["chrono"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# API keys live only in the OS credential store (FR-60, NFR-05), see src/keystore.rs: Windows
# Credential Manager, the macOS Keychain, or the Secret Service (GNOME Keyring, KWallet) on Linux.
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
# HTTPS calls to the AI provider (SRS 5.4), see src/ai/. rustls, so Linux needs no OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Cancelling an AI call (#15) and the ChatGPT sign-in's loopback callback (#31). Tauri already
# runs on tokio, so this adds no new runtime.
tokio = { version = "1", features = ["io-util", "macros", "net", "sync", "time"] }
# Update checks against the GitHub release manifest, signed with the updater key (FR-64, #19),
# and the restart after an update installs.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Signing in with ChatGPT (#31): PKCE, random values and the ID token's RS256 signature. ring
# and base64 are already built for rustls and reqwest, so they add nothing to the app's size.
ring = "0.17"
base64 = "0.23"
# OCR for pages without a text layer (FR-80, #24), see src/ocr.rs. Pure Rust, so it builds the
# same on every platform. The models are a resource fetched by scripts/fetch-ocr-models.mjs.
# rten must be the version ocrs uses; only the ONNX model format is built.
ocrs = { version = "0.13.1", default-features = false, features = ["onnx"] }
rten = { version = "0.26", default-features = false, features = ["onnx_format"] }

# OCR is unusably slow without optimization, so its crates are optimized in dev and test builds too.
[profile.dev.package.ocrs]
opt-level = 3
[profile.dev.package.rten]
opt-level = 3
[profile.dev.package.rten-tensor]
opt-level = 3
[profile.dev.package.rten-imageproc]
opt-level = 3
[profile.dev.package.rten-gemm]
opt-level = 3
[profile.dev.package.rten-vecmath]
opt-level = 3
[profile.dev.package.rten-simd]
opt-level = 3
[profile.dev.package.rten-base]
opt-level = 3
[profile.dev.package.rten-parallel]
opt-level = 3
[profile.dev.package.rten-onnx]
opt-level = 3
[profile.dev.package.rten-shape-inference]
opt-level = 3

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
