[package]
name = "splitr"
version = "0.1.0"
description = "Smart PDF Splitter: split one PDF into several by chapter, invoice, student and more"
authors = ["Caleb Mensah"]
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "splitr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
thiserror = "2"
tauri-plugin-dialog = "2"
# PDF engine (SRS 5.3), see src/pdf.rs. The pdfium_7881 feature must match the PDFium
# version that scripts/fetch-pdfium.mjs downloads; change both together.
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_7881", "image_latest", "thread_safe"] }
lopdf = "0.46"
# Temp files for writing parts before renaming them (NFR-09), see src/export.rs.
tempfile = "3"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
